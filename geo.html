<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b4fe0">
<title>Geography | Ruhaimah’s Learning World</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-subject="geo">
<header>
  <div class="topbar">
    <button class="brand" onclick="goHome()" aria-label="Go to home page">
      <span class="logo">🦄</span>
      <span><span class="title" style="display:block">Ruhaimah’s Learning World</span><span class="sub" style="display:block">Learn • Play • Read • Explore</span></span>
    </button>
    <nav class="top-actions">
      <button class="btn small gold" id="starsBtn" onclick="openDashboard()" aria-label="My stars and progress">⭐ 0</button>
      <button class="btn small" onclick="goHome()" aria-label="Home">🏠 <span class="lbl">Home</span></button>
      <button class="btn small" id="stopBtn" onclick="stopSpeaking()" aria-label="Stop the voice">🔇 <span class="lbl">Stop voice</span></button>
      <button class="btn small" onclick="renderSettings()" aria-label="Settings">⚙️ <span class="lbl">Settings</span></button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer>Made with 💜 for a curious 6-year-old • Progress stays in this browser • No ads</footer>
<script src="app.js"></script>
</body>
</html>
