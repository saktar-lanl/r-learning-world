<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruhaimah's Learning World</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ff;color:#292344;font:18px system-ui,sans-serif}header{background:#5639a5;color:white;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}main{max-width:1000px;margin:auto;padding:24px}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:13px 18px;font-weight:700;color:#30254b;background:#eae4fc;min-height:48px}button:focus-visible{outline:4px solid #eea331}button.primary{background:#6244bc;color:white}button:hover{filter:brightness(.96)}.hero{background:#e9e2ff;border-radius:28px;padding:30px;position:relative}h1{font-size:clamp(28px,5vw,46px);margin:0}h2{margin:12px 0}p{line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.tile{text-align:left;padding:20px;min-height:145px;border:2px solid transparent}.tile span{display:block;font-size:38px}.tile small{display:block;font-weight:400;margin-top:6px}.panel{background:white;border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 4px 18px #3322550d;margin-top:16px}.choices{display:grid;gap:12px;margin:20px 0}.choice{background:#f1edfb;text-align:left;font-size:23px}.right{background:#d4f5df!important}.wrong{background:#ffe5df!important}.bar{height:12px;background:#eee8fa;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#35aa86}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.story{font-size:27px;background:#fff7df;padding:20px;border-radius:16px;line-height:1.7}.feedback{min-height:32px;font-weight:700}.muted{color:#615b78;font-size:15px}canvas{width:100%;max-width:620px;touch-action:none;border:2px solid #ddd;border-radius:15px;background:white}textarea{width:100%;min-height:110px;border:2px solid #ded6f1;border-radius:14px;padding:12px}.palette{display:flex;gap:8px;flex-wrap:wrap}.palette button{min-width:48px;border:2px solid #555}.board{display:grid;grid-template-columns:repeat(8,1fr);max-width:480px;aspect-ratio:1}.square{border-radius:0;padding:0;min-height:0;font-size:clamp(20px,5vw,44px);aspect-ratio:1;color:#191919}.square.light{background:#f4dfb9}.square.dark{background:#ad805d}.square.mark{box-shadow:inset 0 0 0 4px #28a575}footer{text-align:center;padding:20px;color:#615b78;font-size:14px}@media(max-width:480px){main{padding:14px}.grid{grid-template-columns:1fr 1fr}.tile{padding:14px;min-height:125px}header{padding:14px}.hero{padding:22px}}
</style><header><strong>🌈 Ruhaimah’s Learning World</strong><button id="stars" onclick="dashboard()">⭐ 0</button></header><main id="app"></main><footer>Made for curious minds · No accounts or advertisements</footer><script>
const $=s=>document.querySelector(s), app=$('#app');let saved={stars:0,stats:{},days:{},writing:''};try{saved={...saved,...JSON.parse(localStorage.getItem('ruhaimah-v1')||'{}')}}catch(e){};let audio=true;function save(){try{localStorage.setItem('ruhaimah-v1',JSON.stringify(saved))}catch(e){}$('#stars').textContent='⭐ '+saved.stars}save();function speak(t,lang='en-US'){if(!audio)return;if(!('speechSynthesis'in window)){alert('Read-aloud is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.82;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const subjects=[['reading','📚','Reading & phonics','Read stories and sound out words','#fce2ec'],['math','🧮','Math','Add, subtract and solve','#dff2e5'],['english','✏️','English & writing','Spelling and sentences','#fff0d1'],['science','🔬','Science','Discover nature','#d9efff'],['logic','🧩','Logic & puzzles','Patterns and thinking','#ece2ff'],['school','🎯','School practice','Mixed kindergarten skills','#dce8ff'],['general','💡','General knowledge','Everyday discoveries','#ffe4ce'],['geo','🌍','Geography','Our wonderful world','#d5f1ed'],['art','🎨','Art & creativity','Draw and imagine','#fce2ec'],['chess','♟️','Chess','Learn how pieces move','#e6e3fa'],['bangla','🇧🇩','বাংলা · Bangla','Letters and words','#dff2e5']];
const Q=(q,a,c,h,p='',lang='en-US')=>({q,a,c,h,p,lang});const bank={reading:[Q('Which word rhymes with cake?',['cat','lake','cup'],'lake','Cake and lake end with the same sound.'),Q('Which word begins with sh?',['ship','chip','sit'],'ship','S and h together make the sh sound.'),Q('Which word has the short i sound?',['sit','cake','sun'],'sit','Listen to the middle sound in sit.'),Q('What did Mia find?',['a red ball','a blue hat','a cat'],'a red ball','Mia found a red ball.','Mia went to the park. She saw a red ball under a tree. She picked it up.'),Q('Where did the bird go?',['into a box','onto a tree','into a car'],'onto a tree','The bird flew onto a tree.','A little bird sat on a fence. It flew onto a tree and sang.'),Q('Which word completes the sentence? I can ___ a book.',['read','jump','drink'],'read','We read a book.'),Q('What did Ben give the dog?',['water','a hat','a pen'],'water','Ben gave the dog water.','Ben saw a thirsty dog. He got a bowl of water. The dog drank it.'),Q('Which word has ch at the start?',['chair','share','hair'],'chair','C and h together make the ch sound.'),Q('Which word has a silent e?',['cap','cape','cup'],'cape','The final e helps the a say its name.')],english:[Q('Which sentence is correct?',['the cat runs.','The cat runs.','The cat runs'],'The cat runs.','Start with a capital and end with a period.'),Q('Choose the missing letter: d_g',['a','o','i'],'o','Dog is spelled d o g.'),Q('Which is a naming word?',['jump','apple','fast'],'apple','Apple names a thing.'),Q('Choose the action word.',['run','table','blue'],'run','Run tells what someone does.'),Q('Which word means more than one cat?',['cats','cat','catting'],'cats','Add s to make cats.'),Q('Which mark ends a question?',['.','?','!'],'?','A question mark ends a question.'),Q('Finish: She ___ happy.',['is','am','are'],'is','She is happy.')],science:[Q('What helps a plant grow?',['water and sunlight','rocks only','a toy'],'water and sunlight','Plants need water and light.'),Q('Which animal lays eggs?',['hen','cat','dog'],'hen','Hens lay eggs.'),Q('What happens to ice when it warms up?',['melts','turns into wood','grows leaves'],'melts','Ice melts into water.'),Q('Which body part helps you hear?',['ears','knees','nose'],'ears','We hear with our ears.'),Q('Which is a living thing?',['tree','chair','stone'],'tree','A tree grows and is alive.'),Q('What gives Earth light during the day?',['Sun','Moon','clouds'],'Sun','The Sun gives us daylight.')],logic:[Q('What comes next? 🔴 🔵 🔴 🔵',['🔴','🟢','🔵'],'🔴','The colors alternate red and blue.'),Q('Which does not belong?',['apple','banana','shoe'],'shoe','The other two are fruits.'),Q('What comes next? 2, 4, 6, ...',['7','8','10'],'8','Count by twos.'),Q('Which shape has three sides?',['circle','triangle','square'],'triangle','A triangle has three sides.'),Q('What comes next? A B B A B B',['A','B','C'],'A','The pattern repeats A B B.'),Q('Which is smallest?',['elephant','mouse','horse'],'mouse','A mouse is much smaller.')],general:[Q('How many days are in a week?',['5','7','10'],'7','There are seven days.'),Q('What should you do before eating?',['wash hands','wear shoes','turn off the light'],'wash hands','Clean hands help keep us healthy.'),Q('Who helps put out fires?',['firefighter','teacher','baker'],'firefighter','Firefighters help keep people safe.'),Q('What season usually comes after winter?',['spring','fall','summer'],'spring','Spring follows winter.'),Q('What tells the time?',['clock','plate','book'],'clock','A clock shows time.')],geo:[Q('What planet do we live on?',['Mars','Earth','Jupiter'],'Earth','Earth is our home.'),Q('Which is a large body of salt water?',['ocean','hill','forest'],'ocean','Oceans contain salt water.'),Q('Which country has Dhaka as its capital?',['Bangladesh','Canada','Japan'],'Bangladesh','Dhaka is the capital of Bangladesh.'),Q('Which country is New Mexico part of?',['United States','India','Brazil'],'United States','New Mexico is a U.S. state.'),Q('Which direction is opposite north?',['east','south','west'],'south','South is opposite north.'),Q('Which is a continent?',['Asia','Santa Fe','Dhaka'],'Asia','Asia is a continent.')],bangla:[Q('কোনটি স্বরবর্ণ?',['অ','ক','ম'],'অ','অ একটি স্বরবর্ণ।','','bn-BD'),Q('আম কোনটি?',['🥭','🍎','🍌'],'🥭','এটি আম।','','bn-BD'),Q('মাছ কোনটি?',['🐦','🐟','🐈'],'🐟','এটি মাছ।','','bn-BD'),Q('কোনটি বাংলা সংখ্যা ২?',['১','২','৩'],'২','দুই মানে ২।','','bn-BD'),Q('ফুল কোনটি?',['🌸','🚗','📚'],'🌸','এটি ফুল।','','bn-BD'),Q('ক এর পরে কোন বর্ণ?',['গ','খ','চ'],'খ','ক এর পরে খ।','','bn-BD')],chess:[Q('Which piece moves in an L shape?',['Knight','Rook','Bishop'],'Knight','A knight moves two squares one way and one sideways.'),Q('Which piece moves diagonally?',['Bishop','Rook','Pawn'],'Bishop','A bishop moves diagonally.'),Q('Which piece moves straight along rows and columns?',['Rook','Knight','Bishop'],'Rook','A rook moves horizontally or vertically.'),Q('Which piece must you protect?',['King','Pawn','Rook'],'King','Protect your king from checkmate.')],art:[Q('Which two paint colors make green?',['blue and yellow','red and blue','red and white'],'blue and yellow','Blue and yellow paint make green.'),Q('Which shape could you use to draw the Sun?',['circle','triangle','square'],'circle','The Sun looks round.') ]};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function math(n=8,level=1){return Array.from({length:n},()=>{let cap=level===1?10:20,a=Math.floor(Math.random()*(cap+1)),b=Math.floor(Math.random()*(cap-a+1)),sub=Math.random()<.45;if(sub){a+=b}let c=sub?a-b:a+b;let opts=new Set([c]);while(opts.size<3)opts.add(Math.max(0,c+Math.floor(Math.random()*7)-3));return Q(`What is ${a} ${sub?'−':'+'} ${b}?`,shuffle([...opts].map(String)),String(c),`The answer is ${c}. Try counting ${sub?'backward':'forward'} from ${a}.`)})}
let session=null,level=1;function home(){stop();app.innerHTML=`<section class="hero"><div class="topline"><span>🌟 Your adventure starts here</span><button onclick="audio=!audio;home()">${audio?'🔊 Sound on':'🔇 Sound off'}</button></div><h1>Hello, Ruhaimah!</h1><p>Choose something fun to learn, or try your daily adventure.</p><button class="primary" onclick="start('daily')">🚀 Start daily adventure</button> <button onclick="dashboard()">🏆 My progress</button></section><h2>Choose a learning world</h2><div class="grid">${subjects.map(([id,e,t,d,c])=>`<button class="tile" style="background:${c}" onclick="openSubject('${id}')"><span>${e}</span>${t}<small>${d}</small></button>`).join('')}</div>`}function openSubject(id){stop();let s=subjects.find(s=>s[0]===id);app.innerHTML=`<button onclick="home()">← Home</button><section class="panel"><h1>${s[1]} ${s[2]}</h1><p>${s[3]}. Pick an activity!</p><button class="primary" onclick="start('${id}')">▶ Practice</button> ${id==='math'?'<button onclick="level=1;start(\'math\')">Within 10</button> <button onclick="level=2;start(\'math\')">Within 20</button>':''} ${id==='reading'?'<button onclick="library()">📖 Story library</button>':''} ${id==='english'?'<button onclick="writing()">✍️ Writing journal</button>':''} ${id==='art'?'<button onclick="draw()">🎨 Drawing studio</button>':''} ${id==='chess'?'<button onclick="chess()">♟️ Piece movement trainer</button>':''}</section>`}function start(id){stop();let qs=id==='math'?math(8,level):id==='daily'||id==='school'?shuffle([...shuffle(bank.reading).slice(0,3),...math(4,1),...shuffle(bank.english).slice(0,2),...shuffle(bank.logic).slice(0,2),...shuffle(bank.science).slice(0,1)]):shuffle(bank[id]);session={id,qs,i:0,first:0,wrong:false,done:false};render()}function render(){let s=session,q=s.qs[s.i];app.innerHTML=`<div class="topline"><button onclick="home()">← Home</button><span>Question ${s.i+1} / ${s.qs.length}</span><button onclick="readQuestion()">🔊 Listen</button></div><div class="bar"><i style="width:${100*s.i/s.qs.length}%"></i></div><section class="panel">${q.p?`<div class="story">${esc(q.p)}</div>`:''}<h2 style="font-size:30px">${esc(q.q)}</h2><div class="choices">${q.a.map((a,i)=>`<button class="choice" data-i="${i}" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary" hidden onclick="next()">Next →</button></section>`;speak([q.p,q.q,...q.a].filter(Boolean).join('. '),q.lang)}function readQuestion(){let q=session.qs[session.i];speak([q.p,q.q,...q.a].filter(Boolean).join('. '),q.lang)}function answer(i){let s=session,q=s.qs[s.i];if(s.done)return;let b=$(`[data-i="${i}"]`),correct=q.a[i]===q.c;let stats=saved.stats[s.id]||(saved.stats[s.id]={correct:0,total:0,completed:0});if(!s.wrong){stats.total++;if(correct){stats.correct++;s.first++}}if(correct){s.done=true;b.classList.add('right');saved.stars++;$('#feedback').textContent='🌟 Great job! '+q.h;$('#next').hidden=false;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);speak(q.lang==='bn-BD'?'দারুণ! '+q.h:'Great job! '+q.h,q.lang)}else{s.wrong=true;b.classList.add('wrong');b.disabled=true;$('#feedback').textContent='Try again! '+q.h;speak(q.h,q.lang)}save()}function next(){let s=session;if(!s.done)return;if(++s.i<s.qs.length){s.wrong=false;s.done=false;render();return}saved.stats[s.id].completed++;let day=new Date().toLocaleDateString();saved.days[day]=(saved.days[day]||0)+1;save();app.innerHTML=`<section class="panel" style="text-align:center"><h1>🏆 Amazing work!</h1><p>You earned ${s.qs.length} stars and answered ${s.first} of ${s.qs.length} correctly on your first try.</p><button class="primary" onclick="home()">Choose another adventure</button></section>`;speak('Amazing work! You finished your adventure.')}function dashboard(){stop();app.innerHTML=`<button onclick="home()">← Home</button><section class="panel"><h1>🏆 My progress</h1><h2>⭐ ${saved.stars} stars</h2><p>Learning days: ${Object.keys(saved.days).length}</p><p class="muted">Parent view · First-attempt accuracy · Saved in this browser only.</p>${Object.entries(saved.stats).map(([id,s])=>`<p><strong>${subjects.find(x=>x[0]===id)?.[2]||'Daily adventure'}</strong> — ${s.total?Math.round(100*s.correct/s.total):0}% · ${s.completed} sessions</p><div class="bar"><i style="width:${s.total?100*s.correct/s.total:0}%"></i></div>`).join('')||'<p>Finish some activities to see your progress!</p>'}</section>`}
const stories=[['🐈 The little cat','A little cat sat on a mat. It saw a big red ball. The cat ran to the ball. It had fun.','What color was the ball?',['red','blue','green'],'red'],['🌱 A tiny seed','Ana put a seed in a pot. She gave it water. A small green leaf grew. Ana was glad.','What did Ana give the seed?',['water','milk','juice'],'water'],['🦆 At the pond','Sam went to the pond. He saw three ducks. The ducks swam in the water. Sam waved.','How many ducks did Sam see?',['two','three','four'],'three'],['🎒 A school day','Lina packed her bag. She went to school. She read a book with her friend. Then they drew a picture.','What did Lina read?',['a book','a map','a sign'],'a book']];function library(){app.innerHTML=`<button onclick="openSubject('reading')">← Reading</button><h1>📚 Story library</h1><div class="grid">${stories.map((s,i)=>`<button class="tile" onclick="story(${i})">${s[0]}<small>Read and answer</small></button>`).join('')}</div>`}function story(i){let s=stories[i];session={id:'reading',qs:[Q(s[2],s[3],s[4],'Read the story to find the answer.',s[1])],i:0,first:0,wrong:false,done:false};render()}function writing(){app.innerHTML=`<button onclick="openSubject('english')">← English</button><section class="panel"><h2>✍️ My writing journal</h2><p>Write three sentences about your favorite animal. Begin each sentence with a capital letter.</p><button onclick="speak('Write three sentences about your favorite animal.')">🔊 Listen</button><textarea id="journal" placeholder="My favorite animal is...">${esc(saved.writing)}</textarea><button class="primary" onclick="saved.writing=$('#journal').value;save();$('#note').textContent='Saved!'">Save my writing</button><p id="note"></p></section>`}function draw(){app.innerHTML=`<button onclick="openSubject('art')">← Art</button><section class="panel"><h2>🎨 Drawing studio</h2><p>Can you draw a house, a tree, and a happy sun?</p><div class="palette">${['#292344','#f05252','#f4ab24','#34a853','#4285ed','#ab61df','#ffffff'].map(c=>`<button style="background:${c}" aria-label="Paint ${c}" onclick="ink='${c}'"></button>`).join('')}</div><canvas id="paint" width="620" height="420"></canvas><div class="topline"><button onclick="ctx.clearRect(0,0,620,420)">Clear</button><button onclick="downloadDrawing()">Save picture</button></div></section>`;let c=$('#paint');ctx=c.getContext('2d');ctx.lineWidth=8;ctx.lineCap='round';let active=false;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));ctx.lineTo(...point(e));ctx.strokeStyle=ink;ctx.stroke()};c.onpointermove=e=>{if(active){ctx.lineTo(...point(e));ctx.strokeStyle=ink;ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>active=false}let ink='#292344',ctx;function downloadDrawing(){let a=document.createElement('a');a.download='my-drawing.png';a.href=$('#paint').toDataURL();a.click()}
let piece='Knight',pos=35;const glyph={Knight:'♘',Bishop:'♗',Rook:'♖',Queen:'♕',King:'♔',Pawn:'♙'};function targets(){let r=pos>>3,c=pos%8;return Array.from({length:64},(_,i)=>i).filter(i=>{let dr=(i>>3)-r,dc=i%8-c,x=Math.abs(dr),y=Math.abs(dc);if(!x&&!y)return false;return piece==='Knight'?x*y===2:piece==='Bishop'?x===y:piece==='Rook'?x===0||y===0:piece==='Queen'?x===y||x===0||y===0:piece==='King'?Math.max(x,y)===1:dc===0&&(dr===-1||(r===6&&dr===-2))})}function chess(){app.innerHTML=`<button onclick="openSubject('chess')">← Chess</button><section class="panel"><h2>♟️ Piece movement trainer</h2><p>Choose a piece and tap a highlighted square to move it. This is a single-piece exercise, not a full chess game.</p><div class="palette">${Object.keys(glyph).map(p=>`<button onclick="piece='${p}';pos=${p==='Pawn'?52:35};chess()">${glyph[p]} ${p}</button>`).join('')}</div><h3>${piece}</h3><div class="board">${Array.from({length:64},(_,i)=>`<button aria-label="${'abcdefgh'[i%8]}${8-(i>>3)}" class="square ${((i>>3)+i%8)%2?'dark':'light'} ${targets().includes(i)?'mark':''}" onclick="movePiece(${i})">${i===pos?glyph[piece]:targets().includes(i)?'·':''}</button>`).join('')}</div><p id="chessnote" aria-live="polite"></p></section>`}function movePiece(i){if(targets().includes(i)){pos=i;if(piece==='Pawn'&&pos<8){piece='Queen'}chess();$('#chessnote').textContent='Great move!'}else $('#chessnote').textContent='Try a highlighted square.'}home();</script></html>
